<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wp-ai-kit-ui playground</title>
    <style>
      /* Playground chrome only: the package never styles outside `.aikit`. */
      html, body { margin: 0; height: 100%; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; color: #1f2933; background: #f0f0f1; }
      body.pg-dark { background: #1d2327; color: #f0f0f1; }
      #root { height: 100%; }
      .pg { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
      .pg-nav { padding: 16px 12px; border-right: 1px solid #dcdcde; background: #fff; display: flex; flex-direction: column; gap: 4px; }
      .pg-dark .pg-nav { background: #23282d; border-color: #3c434a; }
      .pg-nav h1 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #646970; margin: 0 8px 10px; }
      .pg-nav button { text-align: left; padding: 7px 10px; border: 0; border-radius: 6px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
      .pg-nav button:hover { background: rgba(0, 0, 0, 0.06); }
      .pg-dark .pg-nav button:hover { background: rgba(255, 255, 255, 0.08); }
      .pg-nav button[aria-current="page"] { background: #2271b1; color: #fff; }
      .pg-nav .pg-section { margin: 14px 8px 4px; font-size: 11px; color: #646970; text-transform: uppercase; letter-spacing: .06em; }
      .pg-nav label { display: flex; align-items: center; gap: 8px; padding: 4px 10px; font-size: 13px; }
      .pg-nav select { font: inherit; padding: 2px 4px; }
      .pg-main { min-width: 0; display: flex; flex-direction: column; }
      .pg-content { flex: 1; min-width: 0; padding: 24px; }
      .pg-with-dock { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 100vh; }
      .pg-dock { border-left: 1px solid #dcdcde; background: #fff; height: 100vh; position: sticky; top: 0; display: flex; flex-direction: column; min-height: 0; }
      .pg-dark .pg-dock { background: #23282d; border-color: #3c434a; }
      .pg-dock > * { flex: 1; min-height: 0; }
      .pg-page-chat { height: calc(100vh - 48px); display: flex; flex-direction: column; }
      .pg-page-chat > .aikit { flex: 1; min-height: 0; }
      .pg-card { max-width: 520px; height: 520px; border: 1px solid #c3c4c7; border-radius: 10px; overflow: hidden; background: #fff; display: flex; flex-direction: column; }
      .pg-card > * { flex: 1; min-height: 0; }
      .pg-bleed { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
      .pg-bleed .pg-static { padding: 16px; border: 1px dashed #c3c4c7; border-radius: 8px; }
      .pg-bleed .pg-static table { border-collapse: collapse; }
      .pg-bleed .pg-static td, .pg-bleed .pg-static th { border: 1px solid #c3c4c7; padding: 4px 8px; }
      .pg-toolbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 13px; }
      .pg-toolbar label { display: inline-flex; align-items: center; gap: 6px; }
      .pg-prose h2 { margin-top: 0; }
      .pg-prose p { max-width: 70ch; line-height: 1.6; }
      /* Dark theme: the host sets the tokens on `.aikit[data-theme="dark"]`; the package ships light values only. */
      .aikit[data-theme="dark"] {
        --aikit-bg: #1f2428;
        --aikit-bg-soft: #262c31;
        --aikit-bg-muted: #2f363c;
        --aikit-fg: #e6e9ec;
        --aikit-fg-muted: #a7b0b8;
        --aikit-fg-faint: #7a848d;
        --aikit-border: #353d44;
        --aikit-border-strong: #4a545c;
        --aikit-accent-soft: #2b3344;
        --aikit-success-soft: #173b27;
        --aikit-warning-soft: #3d3010;
        --aikit-danger-soft: #431b18;
        --aikit-info-soft: #1a2a4f;
        --aikit-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        --aikit-shadow-pop: 0 10px 30px rgba(0, 0, 0, 0.55);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
