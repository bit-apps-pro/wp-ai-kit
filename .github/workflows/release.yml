name: release

# A version tag releases both artifacts: Packagist reads the tag for the PHP package;
# this workflow builds the UI package after the same checks CI runs, attaches it to the
# tag's GitHub release (consumers can install that URL), and publishes it to npm when the
# repository has an NPM_TOKEN secret.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # the GitHub release and its package file
  id-token: write # npm provenance

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer check

  npm:
    needs: php
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-contract.mjs --tag "${GITHUB_REF_NAME}"
      - run: pnpm check
      - name: Attach the package to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pnpm pack
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            awk -v v="${TAG#v}" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' ../CHANGELOG.md > release-notes.md
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" bitapps-wp-ai-kit-ui-*.tgz --clobber
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Skip npm
        if: env.NPM_TOKEN == ''
        run: echo "::notice::No NPM_TOKEN secret, so the package was not published to npm; it is attached to the GitHub release."
